<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Rifa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  padding:15px;
}
h2{text-align:center}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}
.tab{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:#ddd;
}
.tab.active{background:#4CAF50;color:#fff}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.estado-reservado{color:#e53935;font-weight:bold}
.estado-confirmado{color:#2e7d32;font-weight:bold}
.estado-cancelado{color:#555;font-weight:bold}
.fecha{font-size:13px;color:#555;margin-bottom:6px}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  margin-right:6px;
}
.confirmar{background:#4CAF50;color:#fff}
.cancelar{background:#c62828;color:#fff}
</style>
</head>

<body>

<h2>📋 Panel de administración</h2>

<div style="margin-bottom:15px;text-align:center;">
  <input type="number" id="buscarNumero" placeholder="Buscar número" 
  style="padding:10px;border-radius:8px;border:1px solid #ccc;width:150px">

  <button onclick="buscarNumero()" 
  style="padding:10px;border-radius:8px;background:#2196F3;color:white;border:none;">
  Buscar
  </button>
</div>

<div class="tabs">
  <button class="tab active" onclick="cambiarTab('reservado')">⏳ Pendientes</button>
  <button class="tab" onclick="cambiarTab('confirmado')">✅ Confirmados</button>
  <button class="tab" onclick="cambiarTab('cancelado')">🗂 Historial</button>
</div>

<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMKX5fQXRZP-Ic0_Z6yWqD0LBWSn6H2t4",
  authDomain: "rifa-2026-1a341.firebaseapp.com",
  projectId: "rifa-2026-1a341"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const contenedor = document.getElementById("lista");
let tabActual = "reservado";
let compras = [];

onSnapshot(collection(db,"compras"), snap=>{
  compras = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
});

window.cambiarTab = function(tab){
  tabActual = tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function render(){
  contenedor.innerHTML = "";

  compras
    .filter(c=>c.estado === tabActual)
    .forEach(c=>{
      const fecha = c.fecha ? c.fecha.toDate().toLocaleString() : "Sin fecha";

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="fecha">🕒 ${fecha}</div>
        <b>👤 ${c.nombre}</b><br>
        📧 ${c.correo}<br>
        📱 ${c.telefono}<br>
        🌆 ${c.ciudad}<br><br>

        🎟 <b>Números:</b><br>${c.numeros.join(", ")}<br><br>
        💰 <b>Total:</b> $${c.total.toLocaleString()}<br>
        📌 Estado:
        <span class="estado-${c.estado}">${c.estado}</span><br><br>

        ${
          c.estado === "reservado"
          ? `
            <button class="confirmar" onclick="confirmar('${c.id}')">Confirmar</button>
            <button class="cancelar" onclick="cancelar('${c.id}')">Cancelar</button>
          `
          : ""
        }
      `;

      contenedor.appendChild(div);
    });
}

window.confirmar = async function(id){
  if(!confirm("¿Confirmar este pago?")) return;
  await updateDoc(doc(db,"compras",id),{estado:"confirmado"});
};

window.cancelar = async function(id){
  if(!confirm("¿Cancelar y mover al historial?")) return;
  await updateDoc(doc(db,"compras",id),{estado:"cancelado"});
};
window.buscarNumero = function(){

  const numero = document.getElementById("buscarNumero").value;

  const resultado = compras.find(c => 
    c.numeros.includes(numero)
  );

  if(!numero){
    alert("Escribe un número");
    return;
  }

  if(resultado){

    const estado = resultado.estado.toUpperCase();

    alert(
      "Número encontrado\n\n" +
      "Nombre: " + resultado.nombre +
      "\nTeléfono: " + resultado.telefono +
      "\nEstado: " + estado
    );

  } else {

    alert("❌ Ese número no ha sido comprado");

  }

};
</script>

</body>
</html>
