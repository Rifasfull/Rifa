<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎟️ Super Rifa de una Xtz 150 y una eco deluxe 0k</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px
}
h1,h2{text-align:center}
.hero,.card,.progress-container{
  background:#fff;
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}
.hero img{
  width:100%;
  border-radius:12px;
  margin-bottom:10px
}
.progress-bar{
  width:100%;
  height:22px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#16a34a,#22c55e);
  transition:width .6s ease;
}
.progress-text{
  margin-top:8px;
  font-weight:bold;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}
button.secondary{background:#2563eb}
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:15px
}
.packages{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
}
.packages button{
  position:relative;
  background:linear-gradient(145deg,#ffffff,#f9fafb);
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px 12px;
  color:#111827;
  box-shadow:0 8px 20px rgba(0,0,0,.07);
}
.packages button:hover{border:1px solid #16a34a;}
.packages .cantidad{
  font-size:24px;
  font-weight:800;
  margin-bottom:6px;
}
.packages .precio{
  font-size:15px;
  font-weight:700;
  color:#16a34a;
}
.badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#ef4444;
  color:#fff;
  font-size:11px;
  padding:6px 10px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal-box{
  background:#fff;
  width:90%;
  max-width:360px;
  padding:26px 22px 22px;
  border-radius:14px;
  text-align:center;
  position:relative;
}
.cerrar-modal{
  position:absolute;
  top:10px;
  right:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  color:#111;
  cursor:pointer;
}
.footer{
  background:#1f2933;
  color:#e5e7eb;
  margin-top:30px;
  padding:22px 15px;
  border-top:4px solid #16a34a;
}
.footer-content{
  max-width:420px;
  margin:auto;
  text-align:center;
  font-size:13.5px;
  line-height:1.6;
}
.footer-copy{
  margin-top:12px;
  font-size:12px;
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="hero">
  <img id="slide" src="img/Foto1.jpg" alt="Rifa">
  <h1>🎟️ GRAN RIFA OFICIAL</h1>
  <p>· Valor por número $5.000</p>
</div>

<div class="progress-container">
  <h2>📊 Progreso de la rifa</h2>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">(0%)</div>
</div>

<!-- RESTO DEL HTML IGUAL (paquetes, modal, etc.) -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMKX5fQXRZP-Ic0_Z6yWqD0LBWSn6H2t4",
  authDomain: "rifa-2026-1a341.firebaseapp.com",
  projectId: "rifa-2026-1a341"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🔥 BARRA EN TIEMPO REAL */
onSnapshot(collection(db,"compras"), (snapshot)=>{

  let totalVendidos = 0;

  snapshot.forEach(doc=>{
    const data = doc.data();

    if(data.estado === "pagado" && Array.isArray(data.numeros)){
      totalVendidos += data.numeros.length;
    }
  });

  const TOTAL = 10000;
  const porcentaje = (totalVendidos / TOTAL) * 100;

  document.getElementById("progressFill").style.width = porcentaje + "%";
  document.getElementById("progressText").innerText =
    porcentaje.toFixed(1) + "% vendido";

});
</script>

</body>
</html>
