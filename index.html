<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎟️ Super Rifa de una Xtz 150 y una eco deluxe 0k</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px
}

h1,h2{text-align:center}

.hero,.card{
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 4px 10px rgba(0,0,0,.08)
}

.hero img{
  width:100%;
  border-radius:12px;
  margin-bottom:10px
}

/* BARRA DE PROGRESO */
.progress-container{
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  text-align:center;
}

.progress-bar{
  width:100%;
  height:22px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#16a34a,#22c55e);
  transition:width .5s ease;
}

.progress-text{
  margin-top:8px;
  font-weight:bold;
  font-size:14px;
}

/* BOTONES GENERALES */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#4CAF50;
  color:white;
  font-size:16px;
  cursor:pointer
}

button.secondary{background:#2196F3}

input{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:15px
}

/* PAQUETES */
.packages{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.packages button{
  background: linear-gradient(145deg,#ffffff,#f0f0f0);
  border: 1px solid #e5e7eb;
  border-radius:16px;
  padding:18px 12px;
  cursor:pointer;
  transition: all .25s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,.06);
  color:#111827;
}

.packages button:hover{
  transform: translateY(-4px);
  box-shadow: 0 12px 22px rgba(0,0,0,.12);
  border:1px solid #16a34a;
}

.packages button .nivel{
  display:block;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:4px;
  color:#6b7280;
}

.packages button .cantidad{
  display:block;
  font-size:22px;
  font-weight:700;
  margin-bottom:6px;
}

.packages button .precio{
  display:block;
  font-size:15px;
  font-weight:600;
  color:#16a34a;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-box{
  background:#fff;
  width:90%;
  max-width:360px;
  padding:26px 22px 22px;
  border-radius:14px;
  text-align:center;
  position:relative;
}

.cerrar-modal{
  position:absolute;
  top:10px;
  right:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  color:#111;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">
  <img id="slide" src="img/Foto1.jpg" alt="Rifa">
  <h1>🎟️ GRAN RIFA OFICIAL</h1>
  <p>Compra mínima 15 números · Valor por número $5.000</p>
</div>

<!-- BARRA DE PROGRESO (luego la conectamos a Firebase) -->
<div class="progress-container">
  <h2>📊 Progreso de la rifa</h2>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">
    0 de 10.000 números vendidos (0%)
  </div>
</div>

<div class="card">
  <h2>📦 Paquetes</h2>
</div>

<div class="packages">

  <button onclick="elegir(15)">
    <span class="nivel">BRONCE</span>
    <span class="cantidad">15 boletos</span>
    <span class="precio">$75.000</span>
  </button>

  <button onclick="elegir(30)">
    <span class="nivel">PLATA</span>
    <span class="cantidad">30 boletos</span>
    <span class="precio">$150.000</span>
  </button>

  <button onclick="elegir(50)">
    <span class="nivel">ORO</span>
    <span class="cantidad">50 boletos</span>
    <span class="precio">$250.000</span>
  </button>

  <button onclick="elegir(100)">
    <span class="nivel">PLATINO</span>
    <span class="cantidad">100 boletos</span>
    <span class="precio">$500.000</span>
  </button>

  <button onclick="elegir(200)">
    <span class="nivel">BLACK EDITION</span>
    <span class="cantidad">200 boletos</span>
    <span class="precio">$1.000.000</span>
  </button>

</div>

<div class="card">
  <h2>✏️ Personalizado</h2>
  <input type="number" id="cantidad" min="15" placeholder="Mínimo 15 números">
  <button onclick="personalizado()">Continuar</button>
</div>

<script>
const fotos=["Foto1.JPG","Foto2.JPG","Foto3.JPG","Foto4.JPG"];
let i=0;
setInterval(()=>{slide.src=fotos[i++%fotos.length]},3000);

let cantidad=0;
const PRECIO=5000;

function elegir(c){
  cantidad=c;
  localStorage.setItem("cantidad",cantidad);
  localStorage.setItem("total",cantidad*PRECIO);
  location.href="checkout.html";
}

function personalizado(){
  const c=Number(document.getElementById("cantidad").value);
  if(c<15){
    alert("La compra mínima es de 15 números");
    return;
  }
  cantidad=c;
  localStorage.setItem("cantidad",cantidad);
  localStorage.setItem("total",cantidad*PRECIO);
  location.href="checkout.html";
}

/* DEMO BARRA (luego la conectamos real) */
function actualizarBarra(vendidos){
  const total=10000;
  const porcentaje=(vendidos/total)*100;
  document.getElementById("progressFill").style.width=porcentaje+"%";
  document.getElementById("progressText").innerText=
    vendidos+" de 10.000 números vendidos ("+porcentaje.toFixed(1)+"%)";
}

/* EJEMPLO VISUAL */
actualizarBarra(0);
</script>

</body>
</html>
