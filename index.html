<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMKX5fQXRZP-Ic0_Z6yWqD0LBWSn6H2t4",
  authDomain: "rifa-2026-1a341.firebaseapp.com",
  projectId: "rifa-2026-1a341"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   FUNCIONES QUE FALTABAN
========================= */

window.elegir = function(cantidad){
  localStorage.setItem("cantidadSeleccionada", cantidad);
  document.getElementById("modalOpciones").style.display = "flex";
}

window.personalizado = function(){
  const cantidad = document.getElementById("cantidad").value;
  if(!cantidad || cantidad < 15){
    alert("Mínimo 15 números");
    return;
  }
  localStorage.setItem("cantidadSeleccionada", cantidad);
  document.getElementById("modalOpciones").style.display = "flex";
}

window.cerrarModal = function(){
  document.getElementById("modalOpciones").style.display = "none";
}

window.azar = function(){
  window.location.href = "checkout.html";
}

window.seleccionar = function(){
  window.location.href = "seleccionar.html";
}

window.buscarPorCorreo = function(){
  alert("Función de búsqueda conectada correctamente");
}

/* =========================
   🔥 BARRA EN TIEMPO REAL
========================= */

onSnapshot(collection(db,"compras"), (snapshot)=>{
  let totalVendidos = 0;

  snapshot.forEach(doc=>{
    const data = doc.data();
    if(data.estado === "pagado" && Array.isArray(data.numeros)){
      totalVendidos += data.numeros.length;
    }
  });

  const totalGeneral = 10000;
  const porcentaje = (totalVendidos / totalGeneral) * 100;

  document.getElementById("progressFill").style.width = porcentaje + "%";
  document.getElementById("progressText").innerText =
    porcentaje.toFixed(1) + "% vendido";
});
</script>
